name: Validate dashboard registry
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test
      - run: bun run build
      - name: Verify generated registry is committed
        run: |
          git diff --exit-code -- registry
          test -z "$(git ls-files --others --exclude-standard -- registry)"
